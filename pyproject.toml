[project]
name = "attn-toy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.45.1",
    "encodec>=0.1.1",
    "ffmpeg>=1.4",
    "huggingface-hub>=0.28.1",
    "numpy>=2.2.2",
    "packaging>=24.2",
    "pandas>=2.2.3",
    "psutil>=6.1.1",
    "pyarrow>=21.0.0",
    "scipy>=1.15.3",
    "setuptools>=75.8.0",
    "soundfile>=0.13.1",
    "tiktoken>=0.8.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.67.1",
    "redis",
    "pyyaml"
]

[project.optional-dependencies]
cuda = [
    #"flash-attn==2.7.2.post1; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.4.5.8; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-nvcc-cu12==12.4.131; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.4.127; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12==12.4.127; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.1.0.70; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.2.1.3; sys_platform == 'linux' or sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
    # the win32 triton pin that used to live here was a cp310-only wheel URL from the
    # WSL era. requires-python is >=3.10, so any resolution targeting win32 + py3.11/3.12
    # failed outright -- which meant `uv lock` could not be run AT ALL, and adding any
    # dependency (matplotlib, for the figures) was blocked by a pin unrelated to it.
    # removed rather than marker-guarded: nothing is developed on win32 any more.
]

# plotting is not needed to train or sample. `uv sync --extra viz` if you want figures.
viz = [
    "matplotlib>=3.8",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

#[tool.uv]
#no-build-isolation-package = ['flash-attn']